$kind: http-request
name: Registro
order: 2000
method: POST
url: '{{base_url}}/registro.php'
headers:
  - key: Content-Type
    value: application/x-www-form-urlencoded
body:
  type: urlencoded
  content:
    - key: nombres
      value: Juan
      description: 'Nombre(s) del paciente (obligatorio)'
    - key: apellidoPaterno
      value: Pérez
      description: 'Apellido paterno (obligatorio)'
    - key: apellidoMaterno
      value: García
      description: 'Apellido materno (opcional)'
    - key: correo
      value: paciente@ejemplo.com
      description: 'Correo electrónico (obligatorio, único)'
    - key: telefono
      value: '5512345678'
      description: 'Teléfono principal (obligatorio)'
    - key: clave
      value: contraseña123
      description: 'Contraseña, mínimo 8 caracteres (obligatorio)'
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const res = pm.response.json();

      pm.test("Status 200", () => pm.response.to.have.status(200));
      pm.test("Tiene campo 'exito' booleano", () => pm.expect(res.exito).to.be.a("boolean"));
      pm.test("Tiene campo 'mensaje' string", () => pm.expect(res.mensaje).to.be.a("string").and.not.empty);

      if (res.exito) {
          pm.test("Registro exitoso: idUsuario es entero positivo", () => {
              pm.expect(res.idUsuario).to.be.a("number").and.above(0);
          });
      } else {
          pm.test("Registro fallido: mensaje de error presente", () => {
              pm.expect(res.mensaje).to.be.a("string").and.not.empty;
          });
      }
